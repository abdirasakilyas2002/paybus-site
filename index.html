<style>
:root{--navy:#0b2a5b;--navy2:#071c3f;--green:#3ba935;--ink:#14223d;--bg:#f4f7fb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Roboto,Tahoma,"Noto Naskh Arabic",Arial,sans-serif;color:var(--ink);line-height:1.6}
[dir=rtl] body{line-height:1.85}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--navy2);color:#fff;position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{font-weight:800;font-size:1.4rem;font-style:italic;text-decoration:none}
.logo b{color:var(--green)}
.lang{display:flex;gap:6px}
.lang button{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:6px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--green);border-color:var(--green)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #8fd88b;outline-offset:2px}
.hero{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding-top:36px}
.kick{color:#8fd88b;font-weight:700;margin:0 0 6px}
.hero h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.15;margin:0 0 12px}
.hero p{color:#dbe6f7;margin:0 0 14px;max-width:36em}
.hero p.big{font-size:1.25rem;color:#fff;font-weight:600}
.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:8px;margin:0 8px 8px 0}
[dir=rtl] .btn{margin:0 0 8px 8px}
.btn.alt{background:transparent;border:2px solid currentColor}
.hero .btn.alt{color:#fff}
.hero img{display:block;width:100%;height:auto;max-height:540px;object-fit:cover;object-position:top;border-radius:16px 16px 0 0}
.note{font-size:.85rem;color:#b9c9e3!important}
section{padding:52px 0}
section.alt{background:var(--bg)}
h2{font-size:1.7rem;margin:0 0 6px;color:var(--navy);line-height:1.25}
h3{margin:0 0 6px;font-size:1.1rem;color:var(--navy)}
.sub{margin:0 0 14px;color:#4b5b78;max-width:46em}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:22px 0}
.card{background:#fff;border:1px solid #dbe3ef;border-radius:12px;padding:20px}
.card p{margin:0}
.step{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;margin-bottom:10px}
ul.list{padding-inline-start:20px;margin:10px 0 22px}
.close{font-weight:700;color:var(--navy);margin:22px 0 8px;font-size:1.15rem}
.tarifs{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));max-width:560px;margin-top:16px}
.price{font-size:2.2rem;font-weight:800;color:var(--navy)}
.price small{font-size:1rem;color:var(--green)}
details{background:#fff;border:1px solid #dbe3ef;border-radius:10px;padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;color:var(--navy)}
details p{margin:10px 0 0}
.contact a.l{font-weight:700;color:var(--navy)}
footer{background:var(--navy2);color:#c8d5ec;padding:22px 0;font-size:.9rem}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero img{max-height:380px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
